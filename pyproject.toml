# pip install git+https://github.com/lolgg313/Heaven3D        (see README: "Install with pip")
#
# The pip package is an EXTRA way to get Heaven3D.  It installs the very same
# files this repository holds (the single-file engine built by build.py, the
# editor, the Hub, the templates and the packages), kept together in one
# folder inside site-packages, plus the commands `heaven3d` and `heaven3d-hub`.
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "heaven3d"
dynamic = ["version"]
description = "Heaven3D: a 3D game engine and editor written in Python on ModernGL"
readme = "README_PYPI.md"
authors = [{ name = "lolgg313" }]
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["game engine", "3d", "opengl", "moderngl", "editor", "pygame", "gamedev", "pbr", "physics", "numba"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
]
# the same libraries install.py installs (there with exact versions for a
# private environment; here as minimums, so they fit into yours)
dependencies = [
    "numpy>=1.24",
    "pyglm>=2.7",
    "moderngl>=5.8",
    "pygame>=2.5",
    "numba>=0.58",
    "Pillow>=9.0",
    "zstandard>=0.21",
    "trimesh>=4.0",
]

[project.optional-dependencies]
draco = ["DracoPy"]          # Draco-compressed glTF models

[project.urls]
Homepage = "https://github.com/lolgg313/Heaven3D"
Documentation = "https://github.com/lolgg313/Heaven3D/tree/main/docs"
Download = "https://github.com/lolgg313/Heaven3D/releases"
Changelog = "https://github.com/lolgg313/Heaven3D#readme"
Issues = "https://github.com/lolgg313/Heaven3D/issues"

[project.scripts]
heaven3d = "heaven3d._cli:editor"
heaven3d-runtime = "heaven3d._cli:runtime"
heaven3d-hub = "heaven3d._cli:hub"

[tool.setuptools]
packages = ["heaven3d"]
include-package-data = false
